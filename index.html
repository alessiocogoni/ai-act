<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIO ACT | Compliance</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#18263b;background:#f3f6fb}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:#2459db;color:white}button.secondary{background:#e8eefb;color:#23458c}aside{position:fixed;inset:0 auto 0 0;width:240px;background:#14243d;color:white;padding:24px 16px;overflow:auto}aside h2{margin:0 0 4px}aside small{color:#aabbd4}nav{margin-top:32px}nav button,summary{display:block;width:100%;text-align:left;background:transparent;color:#dce7fa;padding:12px;border-radius:8px;cursor:pointer}nav button:hover,nav button.active{background:#30496e}details button{padding-left:25px}main{margin-left:240px}header{background:white;padding:15px 28px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #dfe6ef}header span{margin-left:auto}section{padding:30px;max-width:1400px;margin:auto}h1{margin:0 0 8px;font-size:30px}p{line-height:1.6}.muted{color:#64748b}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.card{background:white;border:1px solid #e1e7ef;border-radius:14px;padding:22px;box-shadow:0 3px 12px #15243b08}.metric{font-size:32px;font-weight:700;margin-top:10px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}input,select{padding:11px;border:1px solid #cbd5e1;border-radius:8px;max-width:100%;background:white;color:#18263b}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:13px;border-bottom:1px solid #e5eaf1}th{color:#64748b;font-size:13px}.scroll{overflow:auto}.pill{background:#e8eefb;color:#2450a0;border-radius:20px;padding:5px 10px;white-space:nowrap}.float{position:fixed;right:24px;bottom:24px;border-radius:28px;box-shadow:0 8px 28px #2459db55;z-index:4}.chat{position:fixed;right:24px;bottom:84px;width:min(380px,calc(100vw - 32px));background:white;border:1px solid #dbe3ef;border-radius:16px;box-shadow:0 12px 50px #14243d33;z-index:5;overflow:hidden}.chathead{background:#14243d;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}.messages{height:300px;overflow:auto;padding:15px}.bubble{background:#edf2fa;padding:12px;border-radius:10px;margin:8px 0;white-space:pre-wrap}.mine{background:#dbeafe;margin-left:25px}.chat form{display:flex;padding:12px;gap:8px}.chat input{min-width:0;flex:1}dialog{border:0;border-radius:15px;width:min(460px,90vw);padding:25px}dialog::backdrop{background:#14243d88}dialog form{display:grid;gap:12px}label{display:grid;gap:5px}body.collapsed aside{display:none}body.collapsed main{margin:0}[hidden]{display:none!important}@media(max-width:760px){aside{z-index:6;width:240px}main{margin:0}body:not(.mobileopen) aside{display:none}.cards{grid-template-columns:1fr}section{padding:18px}header{padding:12px}.float{right:16px;bottom:16px}}
</style><aside><h2>AIO ACT</h2><small>AI COMPLIANCE PLATFORM</small><nav><button data-page="dashboard">▦ Dashboard</button><details open><summary>Compliance</summary><button data-page="systems">Registro sistemi AI</button><button data-page="risk">Valutazione rischi</button></details><details open><summary>Operatività</summary><button data-page="tasks">Attività e scadenze</button></details><button data-page="settings">⚙ Impostazioni</button></nav></aside><main><header><button class="secondary" id="menu" aria-label="Menu">☰</button><strong id="crumb">Dashboard</strong><span>Workspace locale</span></header><section id="content"></section></main><button class="float" id="copilot">✦ Copilota AI</button><div class="chat" id="chat" hidden><div class="chathead"><strong>✦ Copilota · guida locale</strong><button id="closechat" aria-label="Chiudi">×</button></div><div class="messages" id="messages"><div class="bubble">Ciao! Posso guidarti nel registro AI, nella valutazione dei rischi e nelle attività. Non sono un modello AI generativo.</div></div><form id="chatForm"><input id="question" placeholder="Scrivi una domanda..." required><button>Invia</button></form></div><dialog id="editor"><form id="editForm"><h2 id="formTitle"></h2><div id="fields"></div><button>Salva</button><button type="button" class="secondary" id="cancel">Annulla</button></form></dialog><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={systems:[],tasks:[]};try{const s=JSON.parse(localStorage.getItem('aio-act-v1'));if(s&&Array.isArray(s.systems)&&Array.isArray(s.tasks))state=s}catch{}let page='dashboard',filter='',editing=null;const save=()=>{try{localStorage.setItem('aio-act-v1',JSON.stringify(state))}catch{alert('Salvataggio locale non disponibile')}};const titles={dashboard:'Dashboard',systems:'Registro sistemi AI',risk:'Valutazione rischi',tasks:'Attività e scadenze',settings:'Impostazioni'};function go(p){page=p;filter='';document.body.classList.remove('mobileopen');render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('menu').onclick=()=>document.body.classList.toggle(innerWidth<=760?'mobileopen':'collapsed');function table(type){const rows=state[type].filter(x=>JSON.stringify(x).toLowerCase().includes(filter.toLowerCase()));return '<div class="scroll"><table><thead><tr>'+ (type==='systems'?'<th>Sistema</th><th>Finalità</th><th>Rischio preliminare</th>':'<th>Attività</th><th>Scadenza</th><th>Stato</th>')+'<th>Azioni</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(type==='systems'?x.purpose:x.date)+'</td><td><span class="pill">'+esc(type==='systems'?x.risk:x.status)+'</span></td><td><button class="secondary" data-edit="'+esc(x.id)+'">Modifica</button> <button class="secondary" data-delete="'+esc(x.id)+'">Elimina</button></td></tr>').join('')+'</tbody></table></div>'+(!rows.length?'<p class="muted">Nessun elemento presente.</p>':'')}function render(){ $('crumb').textContent=titles[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let h='<h1>'+titles[page]+'</h1>';if(page==='dashboard'){let done=state.tasks.filter(x=>x.status==='Completata').length;h+='<p class="muted">Monitora il tuo percorso di conformità.</p><div class="cards"><div class="card">Sistemi registrati<div class="metric">'+state.systems.length+'</div></div><div class="card">Attività aperte<div class="metric">'+(state.tasks.length-done)+'</div></div><div class="card">Attività completate<div class="metric">'+done+'</div></div></div><div class="card"><h2>Prossimi passi</h2><p>Registra i sistemi AI, documenta le finalità e verifica i requisiti applicabili.</p><button data-go="systems">Apri registro</button> <button class="secondary" data-go="tasks">Gestisci attività</button></div>'}else if(page==='systems'||page==='tasks'){h+='<p class="muted">Organizza e aggiorna i dati del workspace.</p><div class="card"><div class="toolbar"><input id="filter" placeholder="Cerca..." value="'+esc(filter)+'"><button id="add">+ Nuovo elemento</button></div><div id="table">'+table(page)+'</div></div>'}else if(page==='risk'){h+='<div class="card"><h2>Screening preliminare</h2><p>Seleziona il contesto d’uso. Il risultato è orientativo, non una classificazione legale.</p><select id="scenario"><option value="">Seleziona...</option><option value="Verificare possibili divieti e relative eccezioni">Manipolazione o social scoring</option><option value="Verificare requisiti per sistemi ad alto rischio e relative eccezioni">Selezione del personale o accesso a servizi essenziali</option><option value="Verificare obblighi di trasparenza e altri requisiti">Chatbot o contenuti sintetici</option><option value="Analisi specifica necessaria">Altro</option></select><p id="result" aria-live="polite"></p></div>'}else{h+='<div class="card"><h2>Dati del workspace</h2><p>I dati sono salvati esclusivamente in questo browser. Non inserire dati sensibili.</p><button id="export">Esporta JSON</button></div>'}$('content').innerHTML=h;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));if($('add')){$('add').onclick=()=>edit();$('filter').oninput=e=>{filter=e.target.value;$('table').innerHTML=table(page);bindRows()};bindRows()}if($('scenario'))$('scenario').onchange=e=>$('result').textContent=e.target.value;if($('export'))$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='aio-act.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}function bindRows(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(state[page].find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Eliminare questo elemento?')){state[page]=state[page].filter(x=>x.id!==b.dataset.delete);save();render()}})}function edit(x){editing=x||null;$('formTitle').textContent=x?'Modifica elemento':'Nuovo elemento';const opts=(arr,val)=>arr.map(a=>'<option '+(a===val?'selected':'')+'>'+esc(a)+'</option>').join('');$('fields').innerHTML='<label>Nome<input name="name" required maxlength="150" value="'+esc(x?.name)+'"></label>'+(page==='systems'?'<label>Finalità<input name="purpose" required value="'+esc(x?.purpose)+'"></label><label>Rischio preliminare<select name="risk">'+opts(['Da valutare','Potenzialmente alto','Trasparenza da verificare'],x?.risk)+'</select></label>':'<label>Scadenza<input type="date" name="date" required value="'+esc(x?.date)+'"></label><label>Stato<select name="status">'+opts(['Da fare','In corso','Completata'],x?.status)+'</select></label>');$('editor').showModal()}$('cancel').onclick=()=>$('editor').close();$('editForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.id=editing?.id||crypto.randomUUID();if(editing)state[page]=state[page].map(y=>y.id===x.id?x:y);else state[page].push(x);save();$('editor').close();render()};$('copilot').onclick=()=>$('chat').hidden=!$('chat').hidden;$('closechat').onclick=()=>$('chat').hidden=true;$('chatForm').onsubmit=e=>{e.preventDefault();let q=$('question').value.trim();if(!q)return;const add=(s,m)=>{let d=document.createElement('div');d.className='bubble'+(m?' mine':'');d.textContent=s;$('messages').append(d)};add(q,true);let t=q.toLowerCase();add(/risch|classific/.test(t)?'Apri Valutazione rischi per uno screening iniziale. Verifica poi la classificazione con un professionista.':/scadenz|attivit/.test(t)?'Hai '+state.tasks.filter(x=>x.status!=='Completata').length+' attività aperte. Puoi aggiornarle nella sezione Attività e scadenze.':/registr|sistem/.test(t)?'Hai '+state.systems.length+' sistemi registrati. Apri Registro sistemi AI per aggiungere finalità e rischio preliminare.':'Sei nella sezione '+titles[page]+'. Posso aiutarti con registro sistemi, rischi e scadenze. Formula una domanda su questi argomenti.');$('question').value='';$('messages').scrollTop=$('messages').scrollHeight};render();
</script></html>
