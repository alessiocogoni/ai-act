</style><aside><h2>AIO ACT</h2><small>AI COMPLIANCE PLATFORM</small><label style="margin-top:24px">Organizzazione<select id="orgSelect" style="width:100%"></select></label><nav><button data-page="home">✦ Copilota</button><button data-page="dashboard">▦ Dashboard</button><details open><summary>Spazio di lavoro</summary><button data-page="systems">Registro sistemi AI</button><button data-page="tasks">Piano d’azione</button><button data-page="training">Formazione</button><button data-page="docs">Documenti</button><button data-page="risk">Valutazione rischi</button></details><details open><summary>Gestione organizzazione</summary><button data-page="dashboard">Panoramica</button><button data-page="profile">Organizzazione</button><button data-page="interviews">Interviste</button><button data-page="survey">Survey personale</button></details><button data-page="settings">Dati e funzionamento</button><small>Versione pilota · Dati locali</small></nav></aside><main><header><button class="secondary" id="menu" aria-label="Menu">☰</button><strong id="crumb">Dashboard</strong><span id="orgHeader"></span><button class="secondary" data-page="profile">Profilo e visura</button></header><section id="content"></section></main><button class="float" id="copilot">✦ Copilota AI</button><div class="chat" id="chat" hidden><div class="chathead"><strong>✦ Copilota · guida locale</strong><button id="closechat" aria-label="Chiudi">×</button></div><div class="messages" id="messages"><div class="bubble">Ciao! Posso guidarti nel registro AI, nella valutazione dei rischi e nelle attività. Non sono un modello AI generativo.</div></div><form id="chatForm"><input id="question" placeholder="Scrivi una domanda..." required><button>Invia</button></form></div><dialog id="editor"><form id="editForm"><h2 id="formTitle"></h2><div id="fields"></div><button>Salva</button><button type="button" class="secondary" id="cancel">Annulla</button></form></dialog><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={systems:[],tasks:[]};try{const s=JSON.parse(localStorage.getItem('aio-act-v1'));if(s&&Array.isArray(s.systems)&&Array.isArray(s.tasks))state=s}catch{}let page='dashboard',filter='',editing=null;const save=()=>{try{localStorage.setItem('aio-act-v1',JSON.stringify(state))}catch{alert('Salvataggio locale non disponibile')}};const titles={dashboard:'Dashboard',systems:'Registro sistemi AI',risk:'Valutazione rischi',tasks:'Attività e scadenze',settings:'Impostazioni'};function go(p){page=p;filter='';document.body.classList.remove('mobileopen');render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('menu').onclick=()=>document.body.classList.toggle(innerWidth<=760?'mobileopen':'collapsed');function table(type){const rows=state[type].filter(x=>JSON.stringify(x).toLowerCase().includes(filter.toLowerCase()));return '<div class="scroll"><table><thead><tr>'+ (type==='systems'?'<th>Sistema</th><th>Finalità</th><th>Rischio preliminare</th>':'<th>Attività</th><th>Scadenza</th><th>Stato</th>')+'<th>Azioni</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(type==='systems'?x.purpose:x.date)+'</td><td><span class="pill">'+esc(type==='systems'?x.risk:x.status)+'</span></td><td><button class="secondary" data-edit="'+esc(x.id)+'">Modifica</button> <button class="secondary" data-delete="'+esc(x.id)+'">Elimina</button></td></tr>').join('')+'</tbody></table></div>'+(!rows.length?'<p class="muted">Nessun elemento presente.</p>':'')}function render(){ $('crumb').textContent=titles[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let h='<h1>'+titles[page]+'</h1>';if(page==='dashboard'){let done=state.tasks.filter(x=>x.status==='Completata').length;h+='<p class="muted">Monitora il tuo percorso di conformità.</p><div class="cards"><div class="card">Sistemi registrati<div class="metric">'+state.systems.length+'</div></div><div class="card">Attività aperte<div class="metric">'+(state.tasks.length-done)+'</div></div><div class="card">Attività completate<div class="metric">'+done+'</div></div></div><div class="card"><h2>Prossimi passi</h2><p>Registra i sistemi AI, documenta le finalità e verifica i requisiti applicabili.</p><button data-go="systems">Apri registro</button> <button class="secondary" data-go="tasks">Gestisci attività</button></div>'}else if(page==='systems'||page==='tasks'){h+='<p class="muted">Organizza e aggiorna i dati del workspace.</p><div class="card"><div class="toolbar"><input id="filter" placeholder="Cerca..." value="'+esc(filter)+'"><button id="add">+ Nuovo elemento</button></div><div id="table">'+table(page)+'</div></div>'}else if(page==='risk'){h+='<div class="card"><h2>Screening preliminare</h2><p>Seleziona il contesto d’uso. Il risultato è orientativo, non una classificazione legale.</p><select id="scenario"><option value="">Seleziona...</option><option value="Verificare possibili divieti e relative eccezioni">Manipolazione o social scoring</option><option value="Verificare requisiti per sistemi ad alto rischio e relative eccezioni">Selezione del personale o accesso a servizi essenziali</option><option value="Verificare obblighi di trasparenza e altri requisiti">Chatbot o contenuti sintetici</option><option value="Analisi specifica necessaria">Altro</option></select><p id="result" aria-live="polite"></p></div>'}else{h+='<div class="card"><h2>Dati del workspace</h2><p>I dati sono salvati esclusivamente in questo browser. Non inserire dati sensibili.</p><button id="export">Esporta JSON</button></div>'}$('content').innerHTML=h;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));if($('add')){$('add').onclick=()=>edit();$('filter').oninput=e=>{filter=e.target.value;$('table').innerHTML=table(page);bindRows()};bindRows()}if($('scenario'))$('scenario').onchange=e=>$('result').textContent=e.target.value;if($('export'))$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='aio-act.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}function bindRows(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(state[page].find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Eliminare questo elemento?')){state[page]=state[page].filter(x=>x.id!==b.dataset.delete);save();render()}})}function edit(x){editing=x||null;$('formTitle').textContent=x?'Modifica elemento':'Nuovo elemento';const opts=(arr,val)=>arr.map(a=>'<option '+(a===val?'selected':'')+'>'+esc(a)+'</option>').join('');$('fields').innerHTML='<label>Nome<input name="name" required maxlength="150" value="'+esc(x?.name)+'"></label>'+(page==='systems'?'<label>Finalità<input name="purpose" required value="'+esc(x?.purpose)+'"></label><label>Rischio preliminare<select name="risk">'+opts(['Da valutare','Potenzialmente alto','Trasparenza da verificare'],x?.risk)+'</select></label>':'<label>Scadenza<input type="date" name="date" required value="'+esc(x?.date)+'"></label><label>Stato<select name="status">'+opts(['Da fare','In corso','Completata'],x?.status)+'</select></label>');$('editor').showModal()}$('cancel').onclick=()=>$('editor').close();$('editForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.id=editing?.id||crypto.randomUUID();if(editing)state[page]=state[page].map(y=>y.id===x.id?x:y);else state[page].push(x);save();$('editor').close();render()};$('copilot').onclick=()=>$('chat').hidden=!$('chat').hidden;$('closechat').onclick=()=>$('chat').hidden=true;$('chatForm').onsubmit=e=>{e.preventDefault();let q=$('question').value.trim();if(!q)return;const add=(s,m)=>{let d=document.createElement('div');d.className='bubble'+(m?' mine':'');d.textContent=s;$('messages').append(d)};add(q,true);let t=q.toLowerCase();add(/risch|classific/.test(t)?'Apri Valutazione rischi per uno screening iniziale. Verifica poi la classificazione con un professionista.':/scadenz|attivit/.test(t)?'Hai '+state.tasks.filter(x=>x.status!=='Completata').length+' attività aperte. Puoi aggiornarle nella sezione Attività e scadenze.':/registr|sistem/.test(t)?'Hai '+state.systems.length+' sistemi registrati. Apri Registro sistemi AI per aggiungere finalità e rischio preliminare.':'Sei nella sezione '+titles[page]+'. Posso aiutarti con registro sistemi, rischi e scadenze. Formula una domanda su questi argomenti.');$('question').value='';$('messages').scrollTop=$('messages').scrollHeight};
const extraTitles={home:'Copilota',training:'Formazione',docs:'Documenti',profile:'Organizzazione',interviews:'Interviste',survey:'Survey personale'};Object.assign(titles,extraTitles,{systems:'Registro IA',tasks:'Piano d’azione',dashboard:'Panoramica',settings:'Dati e funzionamento'});
let orgs;try{orgs=JSON.parse(localStorage.getItem('aio-orgs-v2'))}catch{}if(!Array.isArray(orgs)||!orgs.length)orgs=[{id:'or',name:'Orienta Srl · Demo',data:{systems:[{id:'demo1',name:'Gestionale HR',purpose:'Supporto alla gestione dei CV',risk:'Da valutare'}],tasks:[{id:'demo2',name:'Verificare il trattamento dei CV',date:'2026-12-15',status:'Da fare'}]}},{id:'co',name:'Comune di Valleverde · Demo',data:{systems:[],tasks:[]}}];let current=orgs.find(o=>o.id===localStorage.getItem('aio-current'))||orgs[0];state=current.data;const persist=()=>{localStorage.setItem('aio-orgs-v2',JSON.stringify(orgs));localStorage.setItem('aio-current',current.id)};function syncOrg(){ $('orgSelect').innerHTML=orgs.map(o=>'<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>').join('')+'<option value="new">Nuova organizzazione</option>';$('orgSelect').value=current.id;$('orgHeader').textContent=current.name} $('orgSelect').onchange=()=>{if($('orgSelect').value==='new'){let name=prompt('Nome organizzazione');if(!name?.trim()){syncOrg();return}current={id:crypto.randomUUID(),name:name.trim(),data:{systems:[],tasks:[]}};orgs.push(current)}else current=orgs.find(o=>o.id===$('orgSelect').value);state=current.data;$('messages').innerHTML='<div class="bubble">Workspace cambiato. Come posso aiutarti?</div>';persist();syncOrg();go('home')};window.addEventListener('pagehide',persist);const originalSave=save;const observer=new MutationObserver(()=>{try{persist()}catch{}});observer.observe($('content'),{childList:true});const originalRender=render;
render=function(){originalRender();if(!extraTitles[page])return;let h='<h1>'+titles[page]+'</h1>';if(page==='home'){h+='<p class="muted">'+esc(current.name)+'</p><div class="card"><h1>Da quale uso dell’IA vuoi partire?</h1><p>Descrivimi un’attività in cui usate l’intelligenza artificiale. Ti farò le domande che servono per preparare una scheda e una prima azione.</p><div class="cards"><button data-start="census">Censisci un uso dell’IA<br>Parti da uno strumento e da un’attività.</button><button data-start="hr">Gestionale HR<br>Valuta l’uso dell’IA sui CV.</button><button data-start="plan">Rivedi il piano<br>Controlla le azioni aperte.</button></div><form id="homechat"><input name="message" placeholder="Messaggio per Aio Act" required style="width:75%"><button>Invia</button></form></div>'}else if(page==='profile'){h+='<div class="card"><h2>Profilo e visura</h2><form id="profileform"><label>Ragione sociale<input name="name" required value="'+esc(current.name)+'"></label><label>Partita IVA / codice fiscale<input name="tax" value="'+esc(current.tax)+'"></label><label>Settore<input name="sector" value="'+esc(current.sector)+'"></label><label>Referente<input name="contact" value="'+esc(current.contact)+'"></label><label>Visura (solo nome file registrato)<input type="file" name="visura" accept=".pdf"></label><p>'+esc(current.visura||'Nessuna visura registrata')+'</p><button>Salva profilo</button></form></div>'}else{let labels={training:['Corso','Destinatari','Stato'],docs:['Documento','Riferimento o nota','Stato'],interviews:['Intervista','Referente o esito','Stato'],survey:['Survey','Destinatari o esito','Stato']}[page];let items=state[page]||[];h+='<div class="card"><form id="extraform"><div class="toolbar"><input name="name" placeholder="'+labels[0]+'" required><input name="note" placeholder="'+labels[1]+'" required><select name="status"><option>Da fare</option><option>In corso</option><option>Completato</option></select><button>+ Aggiungi</button></div></form><div class="scroll"><table><thead><tr>'+labels.map(l=>'<th>'+l+'</th>').join('')+'<th>Azioni</th></tr></thead><tbody>'+items.map((x,i)=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.note)+'</td><td>'+esc(x.status)+'</td><td><button class="secondary" data-remove="'+i+'">Elimina</button></td></tr>').join('')+'</tbody></table></div></div>'}$('content').innerHTML=h;if($('extraform')){$('extraform').onsubmit=e=>{e.preventDefault();(state[page]??=[]).push(Object.fromEntries(new FormData(e.target)));persist();render()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state[page].splice(Number(b.dataset.remove),1);persist();render()})}if($('profileform'))$('profileform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);for(let k of ['name','tax','sector','contact'])current[k]=f.get(k);if(f.get('visura')?.name)current.visura=f.get('visura').name;persist();syncOrg();render()};document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{if(b.dataset.start==='plan'){go('tasks');return}go('systems');edit(b.dataset.start==='hr'?undefined:undefined);if(b.dataset.start==='hr')$('editForm').elements.name.value='Gestionale HR';$('chat').hidden=false});if($('homechat'))$('homechat').onsubmit=e=>{e.preventDefault();$('question').value=new FormData(e.target).get('message');$('chat').hidden=false;$('chatForm').requestSubmit()}};syncOrg();go('home');
